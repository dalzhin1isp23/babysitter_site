<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | Крокодил</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="head">
        <img src="amblem.png" alt="Логотип" class="amblem">
        <p class="amblem_text">Крокодил</p>
        <div class="nav-buttons">
            <button class="uslugi">Услуги</button> 
            <button class="uslugi">Клиника</button> 
            <button class="uslugi">Цены</button> 
            <button class="uslugi">Контакты</button> 
            <button class="uslugi">Админ панель</button> 
        </div>
        <button class="uslugi_but">≡</button>
    </div>

    <div class="content">
        <form action="" class="reg_form">
            <h1 class="reg_zag">Авторизация</h1>
            <input type="text" class="input_reg" placeholder="Логин" required>
            <input type="password" class="input_reg" placeholder="Пароль" required>
            <button class="bat_reg">Войти</button>
           
        </form>
    </div>
    
    <div class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>Контакты</h3>
                <p>Телефон: +7 (123) 456-78-90</p>
                <p>Email: info@krokodil.ru</p>
                <p>Адрес: г. Барнаул, ул. Гоголя, 15</p>
            </div>
            <div class="footer-section">
                <h3>Часы работы</h3>
                <p>Пн-Пт: 9:00 - 21:00</p>
                <p>Сб-Вс: 10:00 - 18:00</p>
            </div>
        </div>
       
    </div>
</body>
</html>
